<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">

  <meta name="dmca-site-verification" content="Qk1kNVczTmVYYzg3YmQrTG9HSUNaSHNWeDdwb2w4U0MvblBwZklkQllJbz01">

  <link rel="icon" href="/assets/img/salyte.jpg">
  <link rel="stylesheet" href="/assets/css/app.css?v=3">
  <link rel="stylesheet" href="/assets/css/menu.css?v=3">

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js?v=3"></script>
  <script src="/assets/js/particles.js?v=3"></script>

  <title>Arctic 1.0</title>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    #loading-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity .5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      animation: spinner-anim 2s infinite ease;
      transform-style: preserve-3d;
    }

    .spinner > div {
      background: rgba(0,77,255,.2);
      width: 100%;
      height: 100%;
      border: 2px solid #004dff;
      position: absolute;
    }

    .spinner div:nth-child(1) { transform: translateZ(-22px) rotateY(180deg); }
    .spinner div:nth-child(2) { transform: rotateY(-270deg) translateX(50%); transform-origin: top right; }
    .spinner div:nth-child(3) { transform: rotateY(270deg) translateX(-50%); transform-origin: center left; }
    .spinner div:nth-child(4) { transform: rotateX(90deg) translateY(-50%); transform-origin: top center; }
    .spinner div:nth-child(5) { transform: rotateX(-90deg) translateY(50%); transform-origin: bottom center; }
    .spinner div:nth-child(6) { transform: translateZ(22px); }

    @keyframes spinner-anim {
      0%   { transform: rotate(45deg) rotateX(-25deg) rotateY(25deg); }
      50%  { transform: rotate(45deg) rotateX(-385deg) rotateY(25deg); }
      100% { transform: rotate(45deg) rotateX(-385deg) rotateY(385deg); }
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>
  </div>

  <!-- Top Navigation -->
  <nav id="mytopnav" style="position:absolute; top:0; right:0; padding:20px; background:none;">
    <button class="btn-main"
      onclick="location.href='settings.html'"
      style="background:none; border:0; box-shadow:none;">
      <i class="bi bi-gear" style="font-size:30px;"></i>
      Menu
    </button>
  </nav>

  <!-- Main Content -->
  <center style="margin-top:50px;">
    <h1 style="font-family:poppins; font-size:50px; color:#fff;">Arctic 1.0</h1>
    <p style="font-size:30px; margin:0;">Welcome</p>

    <form method="POST" id="uform" style="margin-top:25px;">
      <input type="text" name="url" class="form__input"
        placeholder="🧊 Search Or Type URL 🧊"
        style="font-family:poppins; font-size:20px;">
    </form>
  </center>

  <!-- DMCA Badge -->
  <div style="position:fixed; bottom:35px; left:50%; transform:translateX(-50%);">
    <link rel="stylesheet" href="https://images.dmca.com/badges/dmca.css?ID=69966a82-521e-4db4-b85c-e39389f2d5d4">
    <div id="DMCA-badge">
      <div class="dm-1 dm-1-b" style="background:#30458c; border-color:#878787;">
        <a href="https://www.dmca.com/" style="color:white;">DMCA</a>
      </div>
      <div class="dm-2 dm-2-b" style="background:#000;">
        <a href="http://www.dmca.com/Protection/Status.aspx?ID=69966a82-521e-4db4-b85c-e39389f2d5d4" style="color:white;">
          PROTECTED
        </a>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="/wk/wk2.js?v=3"></script>
  <script src="/wk/wk3.js?v=3"></script>
  <script src="/assets/js/themes.js?v=3"></script>
  <script src="/assets/js/index.js?v=3"></script>
  <script src="/assets/js/anym.js?v=3"></script>
  <script src="/assets/js/main.js?v=3"></script>

  <script>
    const loading = document.getElementById('loading-screen');
    const disabled = localStorage.getItem('loadingScreenDisabled') === 'true';

    if (!disabled) {
      loading.style.display = 'flex';

      window.addEventListener('load', () => {
        loading.classList.add('fade-out');
        setTimeout(() => loading.style.display = 'none', 500);
      });
    }
  </script>

</body>
</html>
